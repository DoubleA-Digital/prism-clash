# Backup keep-awake for the Render game server. The server already pings its own public URL
# every 10 minutes (server/src/main.ts); GitHub only starts these scheduled runs every few hours,
# so this is just a safety net. (Public repo: Actions minutes are free.)
name: Keep game server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping /healthz
        run: |
          for i in 1 2 3 4; do
            curl -fsS --max-time 90 https://prism-clash.onrender.com/healthz || echo "ping $i failed"
            echo
            if [ "$i" -lt 4 ]; then sleep 240; fi
          done
