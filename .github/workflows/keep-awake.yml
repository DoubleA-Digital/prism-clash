# Keeps the Render game server awake. Render's free tier sleeps after ~15 minutes without
# traffic, and a sleeping server wipes its rooms and takes up to a minute to wake.
# GitHub can start scheduled runs late, so each run pings every 4 minutes for ~12 minutes and
# the runs overlap; a late start never leaves a 15-minute gap. (Public repo: Actions minutes are free.)
name: Keep game server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping /healthz
        run: |
          for i in 1 2 3 4; do
            curl -fsS --max-time 90 https://prism-clash.onrender.com/healthz || echo "ping $i failed"
            echo
            [ "$i" -lt 4 ] && sleep 240
          done
