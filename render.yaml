# Render blueprint: New + > Blueprint > pick this repo. Free plan works (it sleeps when idle).
services:
  - type: web
    name: prism-clash
    runtime: node
    plan: free
    # Render's system Node folder is read-only (so `corepack enable` can fail): install pnpm into
    # a user prefix instead. NODE_ENV=production would make pnpm skip the build tools, hence
    # --prod=false.
    buildCommand: >-
      npm install -g --prefix "$HOME/.pnpm-cli" pnpm@10.34.7 &&
      export PATH="$HOME/.pnpm-cli/bin:$PATH" &&
      pnpm --version &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm build
    startCommand: node server/dist/main.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: LOG_LEVEL
        value: info
      - key: MAX_ROOMS
        value: "200"
